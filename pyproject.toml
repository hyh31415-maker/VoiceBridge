[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "voicebridge-desktop"
version = "1.1.0"
description = "Small native realtime voice translation client"
requires-python = ">=3.13"
dependencies = ["aiohttp>=3.12,<4", "sounddevice==0.5.6", "audioop-lts==0.2.2"]

[project.scripts]
voicebridge = "voicebridge.ui:main"

[tool.setuptools.packages.find]
where = ["desktop"]

[tool.setuptools.package-data]
voicebridge = ["assets/*"]
